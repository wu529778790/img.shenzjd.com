<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="100%" role="img">
<title>Loader 与 Splitter 流程示意图</title>
<desc>各种知识来源经 loader 转换为 Document，再经 splitter 分割成小块，最后向量化存入知识库</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="28" font-size="12" fill="#5F5E5A">① 加载 Loader</text>

<g>
<rect x="180" y="40" width="320" height="52" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">各种知识来源</text>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">word / pdf / 网页 / youtube / 推文</text>
</g>

<g>
<rect x="180" y="116" width="320" height="52" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="134" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Loader 转换</text>
<text x="340" y="152" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">180+ 种 · @langchain/community</text>
</g>

<g>
<rect x="180" y="192" width="320" height="52" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="210" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Document（大文档）</text>
<text x="340" y="228" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">可能是一本书的大小</text>
</g>

<text x="40" y="276" font-size="12" fill="#5F5E5A">② 分割 Splitter</text>

<g>
<rect x="180" y="288" width="320" height="52" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="306" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Splitter 分割</text>
<text x="340" y="324" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">chunkSize + chunkOverlap + separators</text>
</g>

<g>
<rect x="180" y="364" width="320" height="52" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="382" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">小 Chunk ×N</text>
<text x="340" y="400" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">每个 Chunk 都是 Document 对象</text>
</g>

<text x="40" y="448" font-size="12" fill="#5F5E5A">③ 入库</text>

<g>
<rect x="180" y="460" width="320" height="52" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="478" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Embedding 向量化 → 向量数据库</text>
<text x="340" y="496" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">用于 RAG 语义检索</text>
</g>

<path d="M340 92 L340 116" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 168 L340 192" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 244 L340 288" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 340 L340 364" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 416 L340 460" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="44" y="210" font-size="12" fill="#888780">加载</text>
<text x="44" y="226" font-size="12" fill="#888780">转换</text>
<text x="44" y="318" font-size="12" fill="#888780">按</text>
<text x="44" y="334" font-size="12" fill="#888780">分割</text>
<text x="44" y="396" font-size="12" fill="#888780">小块</text>
</svg>
