# img.shenzjd.com 静态站点托管配置
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带内容哈希的静态资源：永久缓存
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 图标等公共资源：长缓存
    location ~* \.(png|jpg|jpeg|webp|avif|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Service Worker：必须每次重新校验，否则 SW 更新会被 HTTP 缓存阻塞
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
    }

    # 页面路由：Next 静态导出使用 trailingSlash（/management/ → /management/index.html）
    # HTML 明确禁用缓存（含 CDN 层），避免发版后缓存的旧页面引用已不存在的新 hash chunk
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 自定义 404 页面
    error_page 404 /404.html;
}
