# img.shenzjd.com 生产部署编排
# 镜像为纯静态站点（Next 静态导出 out/），由容器内 nginx 托管，监听 80
# 与 CI（.github/workflows/docker.yml）的 docker run 参数保持一致：宿主机 6704 → 容器 80
services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/img.shenzjd.com:latest
    container_name: imgx-app
    ports:
      - "6704:80"
    restart: unless-stopped
    # 与 CI 部署参数一致，nginx 静态托管内存占用极低
    mem_limit: 128m
    memswap_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
