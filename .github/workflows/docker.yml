# Docker build, push, and deploy workflow
name: Create and publish a Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Always emit a `latest` tag so the deploy step can pull `:latest`.
          flavor: |
            latest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Deploy the freshly pushed image to the production server over SSH.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            REPO_LOWER="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
            IMAGE="ghcr.io/$REPO_LOWER:latest"
            CONTAINER="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
            sudo docker pull "$IMAGE"
            sudo docker stop "$CONTAINER" || true
            sudo docker rm "$CONTAINER" || true
            # 一次性迁移：清理旧品牌命名的历史容器
            sudo docker stop imgx-app 2>/dev/null || true
            sudo docker rm imgx-app 2>/dev/null || true
            sudo docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              --memory=128m \
              --memory-swap=256m \
              --cpus=0.5 \
              -p 6704:80 \
              "$IMAGE"
            sudo docker image prune -f

      # 发版后清除 Cloudflare 边缘缓存，防止旧 HTML 引用已被替换的 chunk 导致 404
      # 注：secrets 上下文不能直接用于 if 条件，需先映射到 env
      - name: Purge Cloudflare cache
        if: ${{ env.CF_ZONE_ID != '' && env.CF_API_TOKEN != '' }}
        continue-on-error: true
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
