# 部署静态站点到 GitHub Pages（默认兜底托管）
# 前置：仓库 Settings → Pages → Source 选择 "GitHub Actions"；
#       如需绑定自定义域名（img.shenzjd.com），在仓库根目录添加 CNAME 文件或 Pages 设置里填写
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # 已绑定自定义域名 img.shenzjd.com（根路径托管），不注入 basePath；
          # 若改回纯项目站访问（wu529778790.github.io/img.shenzjd.com/），需恢复：
          # NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
