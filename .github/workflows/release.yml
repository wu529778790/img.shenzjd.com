# 打包静态 HTML 产物并发布到 GitHub Release
# 触发：推送 v* 标签（与 docker.yml 打包同节奏）或手动 workflow_dispatch
# 产物：纯静态导出 out/ 打成 zip 附到 Release，解压后可用任意根路径静态托管
#       （nginx / Cloudflare Pages / S3 / 本地服务器）直接使用
name: Release static HTML

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-static
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Release 产物按根路径托管（不设置 basePath），与 GitHub Pages 的子路径部署区分

      - name: Compute release metadata
        id: meta
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "release=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "file=imgx-static-$GITHUB_REF_NAME.zip" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            STAMP="static-$(date +%Y%m%d-%H%M%S)"
            echo "release=$STAMP" >> "$GITHUB_OUTPUT"
            echo "file=imgx-static-$STAMP.zip" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package static HTML (out/)
        run: |
          cd out
          zip -r "../${{ steps.meta.outputs.file }}" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release }}
          name: ${{ steps.meta.outputs.release }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: ${{ steps.meta.outputs.file }}